<ul class="post-list" style="list-style: none; padding-left: 0;">
  {% for post in site.posts %}
    <li style="margin-bottom: 12px;">
      <!-- 日期 -->
      <span class="post-meta" style="color: #666; font-size: 0.9em; margin-right: 8px;">
        {{ post.date | date: "%Y-%m-%d" }}
      </span>

      <!-- 專案標籤 (如果有設定 project 欄位) -->
      {% if post.project %}
        <span style="background: #eef; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; margin-right: 6px;">
          {{ post.project }}
        </span>
      {% endif %}

      <!-- 超連結 -->
      {% if post.external_url %}
        <!-- 外部專案文章：加 <a> 標籤並設定 target="_blank" (開新分頁) -->
        <a href="{{ post.external_url }}" target="_blank" rel="noopener noreferrer" style="font-weight: bold;">
          {{ post.title }} ↗
        </a>
      {% else %}
        <!-- 本機文章：加 <a> 標籤同頁開啟 -->
        <a href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      {% endif %}
    </li>
  {% endfor %}
</ul>
