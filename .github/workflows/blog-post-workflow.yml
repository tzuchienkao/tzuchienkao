name: Latest blog post workflow
on:
  schedule:
    # 每 12 小時自動執行檢查一次 (Cron Job)
    - cron: '0 */12 * * *'
  workflow_dispatch: # 允許你隨時在 Actions 頁面手動點按鈕更新

permissions:
  contents: write # 讓 Action 有權限寫入並 Commit 修改 README.md

jobs:
  update-readme-with-blog:
    name: Update Profile README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Pull in blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Jekyll 預設會在主站根目錄產生 feed.xml
          feed_list: "https://tzuchienkao.github.io/tzuchienkao/feed.xml"
          max_post_count: 5
          # 自訂呈現樣式格式（支援 Markdown 語法）
          template: "$newline- [$title]($url) (`$date`)"
          date_format: "yyyy-mm-dd"